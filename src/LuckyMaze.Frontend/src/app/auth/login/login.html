<div class="flex min-h-screen items-center justify-center p-4">
  <section hlmCard class="w-full max-w-sm">
    <div hlmCardHeader>
      <h1 hlmCardTitle class="text-2xl">Sign in</h1>
      <p hlmCardDescription>Enter your username and password to play.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-6">
      <div hlmCardContent class="space-y-4">
        <div class="space-y-2">
          <label hlmLabel for="identifier">Username or email</label>
          <input
            id="identifier"
            type="text"
            hlmInput
            class="w-full"
            formControlName="identifier"
            autocomplete="username"
          />
        </div>

        <div class="space-y-2">
          <label hlmLabel for="password">Password</label>
          <input
            id="password"
            type="password"
            hlmInput
            class="w-full"
            formControlName="password"
            autocomplete="current-password"
          />
        </div>
      </div>

      <div hlmCardFooter class="flex-col items-stretch gap-3">
        <button type="submit" hlmBtn [disabled]="form.invalid || submitting()" class="w-full">
          {{ submitting() ? 'Signing in…' : 'Sign in' }}
        </button>
        <p class="text-center text-sm text-muted-foreground">
          No account yet? <a routerLink="/register" class="underline">Register</a>
        </p>
      </div>
    </form>
  </section>
</div>
