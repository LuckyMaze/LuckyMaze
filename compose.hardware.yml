# Additive overlay - only for the actual Raspberry Pi, with the Pico and Klipper's socket really
# there. `compose.yml` alone runs the API in hardware-mock mode (commands are logged, not sent),
# which is what you want anywhere else (a dev machine, CI, a staging host).
#
#   docker compose -f compose.yml -f compose.hardware.yml up -d
#
# See docs/deployment.md for what each of these actually is and how to find the values for your
# host.
services:
  api:
    environment:
      Hardware__PicoPort: "${Hardware__PicoPort:-/dev/ttyACM0}"
      Hardware__KlippySocketPath: "${Hardware__KlippySocketPath:-/home/lucky-user/printer_data/comms/klippy.sock}"
      Hardware__HostAgentRequestPath: "${Hardware__HostAgentRequestPath:-/hostagent/requests}"
      # Pixel pitch, origin offset, axis inversion, feed rates and acceleration all live in
      # GameSettings now (admin panel), not here - they're per-rig physical calibration with no
      # reason to need a restart to change, unlike these paths and the group IDs below, which are
      # tied to this container's actual device/volume mounts.
    devices:
      - "${Hardware__PicoPort:-/dev/ttyACM0}:${Hardware__PicoPort:-/dev/ttyACM0}"
    group_add:
      - "${Hardware__DialoutGroupId:-20}"
      # klippy.sock is owned by whoever runs Klipper and their own primary group - dialout only
      # covers the serial device, not this. See docs/deployment.md.
      - "${Hardware__KlipperGroupId:-1000}"
    volumes:
      - "${Hardware__KlippySocketPath:-/home/lucky-user/printer_data/comms/klippy.sock}:${Hardware__KlippySocketPath:-/home/lucky-user/printer_data/comms/klippy.sock}"
      # Shared with the host agent (scripts/hostagent) - the container writes request files here,
      # the agent (running outside Docker, with the privilege the container doesn't have) picks
      # them up and performs the actual shutdown/network-mode change. See docs/deployment.md.
      - "${Hardware__HostAgentRequestPathHost:-/home/lucky-user/hostagent/requests}:/hostagent/requests"
