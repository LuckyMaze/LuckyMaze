# hostapd config for the LuckyMaze cabinet's own WiFi. Installed to /etc/hostapd/hostapd.conf by
# setup.sh. See docs/captive-portal.md for what this does and how to change it.

interface=wlan0
driver=nl80211

ssid=LuckyMaze
hw_mode=g
channel=7

# Open network on purpose - this is an arcade cabinet, not something with an account to protect.
# Add wpa=2 / wpa_passphrase=... here if you want a password instead; the captive portal still
# works either way; a password just adds a WiFi prompt before it.
auth_algs=1
wmm_enabled=0

# 2.4GHz b/g/n, broad compatibility over range/speed - the game doesn't need much bandwidth.
ieee80211n=1
