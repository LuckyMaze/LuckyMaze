# Redirects every request on port 80 to the real game, regardless of host or path. This is the
# standard captive-portal technique: platforms (iOS's Captive Network Assistant, Android's
# NetworkMonitor, Windows) all treat an HTTP 3xx redirect as a reliable "there's a portal here"
# signal - more reliably than serving the page directly with a 200, which some versions don't
# recognize as different enough from the "no portal" response they expected. See
# docs/captive-portal.md. Installed by install.sh, only enabled while the hotspot is (enable.sh).
server {
    listen 80 default_server;
    server_name _;
    return 302 http://192.168.4.1:8080$request_uri;
}
