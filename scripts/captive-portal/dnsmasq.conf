# dnsmasq config for the LuckyMaze cabinet's WiFi: DHCP for wlan0, and DNS that answers every name
# with the Pi's own address. Installed to /etc/dnsmasq.d/luckymaze.conf by setup.sh - a drop-in
# file, so it doesn't touch anything else already using dnsmasq. See docs/captive-portal.md.

interface=wlan0
bind-interfaces

dhcp-range=192.168.4.2,192.168.4.50,255.255.255.0,12h
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# The actual captive-portal trick: every DNS query, for any domain, gets this answer. Combined with
# the nftables rule that also NATs all port-80 traffic here, it doesn't matter what URL a phone's
# connectivity check happens to hit - it always lands on this host.
address=/#/192.168.4.1

# This host resolves nothing real anyway (no internet uplink on wlan0), so don't waste time trying.
no-resolv
no-poll
